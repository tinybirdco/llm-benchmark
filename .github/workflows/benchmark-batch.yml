name: Batch benchmark untested models

on:
  workflow_dispatch:
    inputs:
      max_models:
        description: "Maximum number of models to benchmark in this run"
        required: false
        default: "10"
        type: string
      start_from:
        description: "Start from this model index (for pagination)"
        required: false
        default: "0"
        type: string

jobs:
  batch-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Fetch untested models
        working-directory: src
        run: npm run fetch-models

      - name: Parse untested models
        id: parse-models
        working-directory: src
        run: |
          # Read the untested models JSON file
          if [ -f "untested-models.json" ]; then
            # Extract models array and convert to space-separated list
            MODELS=$(node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('untested-models.json', 'utf8'));
              const models = data.models.slice(${{ github.event.inputs.start_from || '0' }}, ${{ github.event.inputs.start_from || '0' }} + ${{ github.event.inputs.max_models || '10' }});
              console.log(models.map(m => m.provider + '/' + m.model).join(' '));
            ")
            echo "models=$MODELS" >> $GITHUB_OUTPUT
            echo "Found models: $MODELS"
          else
            echo "No untested models found"
            echo "models=" >> $GITHUB_OUTPUT
          fi

      - name: Run batch benchmarks
        if: steps.parse-models.outputs.models != ''
        working-directory: src
        run: |
          MODELS="${{ steps.parse-models.outputs.models }}"
          echo "Running benchmarks for models: $MODELS"
          
          for model in $MODELS; do
            echo "=== Benchmarking $model ==="
            npm run benchmark -- --model="$model" --debug || echo "Benchmark failed for $model, continuing..."
            echo "Completed benchmark for $model"
            sleep 2
          done

      - name: Create Pull Request
        if: steps.parse-models.outputs.models != ''
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: add batch benchmark results for ${{ github.event.inputs.max_models || '10' }} models"
          title: "Batch benchmark results for ${{ github.event.inputs.max_models || '10' }} untested models"
          body: |
            This PR adds benchmark results for **${{ github.event.inputs.max_models || '10' }}** untested models from OpenRouter.
            
            **Models benchmarked:**
            ${{ steps.parse-models.outputs.models }}
            
            The following files have been updated:
            - `src/benchmark/results.json` - Raw benchmark results
            - `src/benchmark/validation-results.json` - Validation results against human baseline
            - `src/benchmark-config.json` - Updated with new providers and models
            
            This PR was automatically generated by the batch benchmark workflow.
            
            @alrocar
          branch: batch-benchmark-${{ github.run_id }}
          base: main
          delete-branch: true

      - name: No models to benchmark
        if: steps.parse-models.outputs.models == ''
        run: |
          echo "No untested models found to benchmark"
          exit 0
