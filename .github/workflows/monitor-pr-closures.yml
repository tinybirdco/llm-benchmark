name: Monitor PR closures for rejected models

on:
  pull_request:
    types: [closed]

jobs:
  handle-rejected-model:
    if: github.event.pull_request.merged == false && contains(github.event.pull_request.title, 'Add benchmark results for')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Extract model from PR title
        id: extract-model
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Extract model from title like "Add benchmark results for openrouter/sonoma-dusk-alpha"
          MODEL=$(echo "$PR_TITLE" | sed 's/Add benchmark results for //')
          MODEL_ID_RE='^~?[a-z0-9][a-z0-9._:-]*/[a-z0-9._:/-]+$'
          if ! [[ "$MODEL" =~ $MODEL_ID_RE ]]; then
            echo "::error::PR title does not contain a valid model ID"
            exit 1
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "Extracted model: $MODEL"

      - name: Add rejected model to failed list
        working-directory: src
        env:
          MODEL: ${{ steps.extract-model.outputs.model }}
        run: |
          PROVIDER=$(echo "$MODEL" | cut -d'/' -f1)
          MODEL_NAME=$(echo "$MODEL" | cut -d'/' -f2)

          echo "Adding rejected model to failed list: $MODEL"

          npm run manage-failed-models add "$PROVIDER" "$MODEL_NAME" "$MODEL" "PR rejected/closed without merging"

          echo "Model $MODEL has been added to the failed list"

      - name: Commit changes to repository
        env:
          MODEL: ${{ steps.extract-model.outputs.model }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if there are changes to commit
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add src/failed-models.json
            git commit -m "Add rejected model $MODEL to failed list

          - Model: $MODEL
          - Reason: PR rejected/closed without merging
          - PR: #${{ github.event.pull_request.number }}
          
          This prevents the model from being automatically benchmarked again."
            
            git push origin main
            echo "Changes committed and pushed to main branch"
          fi

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          MODEL: ${{ steps.extract-model.outputs.model }}
        with:
          script: |
            const model = process.env.MODEL;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Model Rejected
              
              The model **${model}** has been added to the failed models list.

              **What this means:**
              - This model is tracked as a rejected benchmark
              - Discovery will still find it, but it won't be re-benchmarked automatically while in the failed list

              **To manage this model:**
              \`\`\`bash
              # Remove from failed list (to allow re-benchmarking)
              npm run manage-failed-models remove ${model.split('/')[0]} ${model.split('/')[1]}

              # List all failed models
              npm run manage-failed-models list
              \`\`\`
              
              @alrocar`
            });
