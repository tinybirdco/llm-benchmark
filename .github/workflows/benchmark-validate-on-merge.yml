name: Validate benchmark results on merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  validate:
    if: >
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.title, 'Add benchmark results for') ||
       startsWith(github.event.pull_request.title, 'Batch benchmark results for'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Extract models from PR
        id: models
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$PR_TITLE" | grep -q "^Add benchmark results for "; then
            # Single model PR — extract from title
            MODEL=$(echo "$PR_TITLE" | sed 's/Add benchmark results for //')
            echo "models=$MODEL" >> $GITHUB_OUTPUT
          elif echo "$PR_TITLE" | grep -q "^Batch benchmark results for "; then
            # Batch PR — extract models list from PR body
            # The body contains "**Models benchmarked:**\n<space-separated models>"
            MODELS=$(echo "$PR_BODY" | grep -A1 "Models benchmarked" | tail -1 | xargs)
            echo "models=$MODELS" >> $GITHUB_OUTPUT
          fi

      - name: Validate results in Tinybird
        if: steps.models.outputs.models != ''
        working-directory: src
        env:
          TINYBIRD_API_HOST: ${{ vars.TINYBIRD_API_HOST }}
          TINYBIRD_WORKSPACE_TOKEN: ${{ secrets.TINYBIRD_WORKSPACE_TOKEN }}
        run: |
          MODELS="${{ steps.models.outputs.models }}"
          for model in $MODELS; do
            echo "Validating $model..."
            npm run benchmark -- --model="$model" --validate
          done

      - name: Update benchmark config and clean up
        if: steps.models.outputs.models != ''
        run: |
          MODELS="${{ steps.models.outputs.models }}"
          cd src

          for model in $MODELS; do
            node -e "
              const fs = require('fs');
              const config = JSON.parse(fs.readFileSync('benchmark-config.json','utf8'));
              const parts = process.argv[1].split('/');
              const provider = parts[0];
              const modelName = parts.slice(1).join('/');
              if (!config.providers[provider]) config.providers[provider] = { models: [] };
              if (!config.providers[provider].models.includes(modelName)) {
                config.providers[provider].models.push(modelName);
                fs.writeFileSync('benchmark-config.json', JSON.stringify(config, null, 2));
                console.log('Added ' + modelName + ' to ' + provider);
              } else {
                console.log(modelName + ' already in ' + provider);
              }
            " "$model"
          done

          cd ..
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Clean up benchmark run files
          git rm src/benchmark-runs/*.json 2>/dev/null || true

          git add src/benchmark-config.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update benchmark config for $MODELS"
            git pull --rebase origin main
            git push origin main
          else
            echo "No config changes needed"
          fi
